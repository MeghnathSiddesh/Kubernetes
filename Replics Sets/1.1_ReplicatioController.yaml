# a selector option is available in a ReplicationController, 
# though it is optional and only supports basic equality-based label matching. 
# If you omit the selector field in your YAML manifest, Kubernetes automatically populates it using the labels defined in your pod template (spec.template.metadata.labels).

How selector Works in a ReplicationController

• Equality-Based Only: A ReplicationController selector only checks for exact key-value matches (such as app: redis). It does not support advanced set-based expressions like matchExpressions (In, NotIn, Exists) found in ReplicaSets and Deployments.
• Flat Map Structure: Unlike newer resources that nest labels under selector.matchLabels, a ReplicationController places key-value pairs directly under spec.selector.
• Optional Field: Leaving spec.selector blank is common practice. Kubernetes defaults it to match the exact labels inside spec.template.metadata.labels.

apiVersion: v1
kind: ReplicationController
metadata:
  name: redis-rc
spec:
  replicas: 3
  selector:
    app: redis  # Optional; matches template labels directly without matchLabels
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis
