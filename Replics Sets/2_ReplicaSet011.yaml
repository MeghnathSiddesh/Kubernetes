# it is very similar to replication controller

apiVersion: apps/v1
# replicaset api version is apps/v1
# if you type this wrong, you'll get error "no match for kind=ReplicaSet", because sepcified version has no support for replicaset
kind: ReplicaSet
metadata: 
  name: myapp-replicaset
  labels: 
    app: myapp
    type: front-end
spec: 
  template:
    name: my-app
      labels: 
        app: myapp
        type: frontend
    spec: 
      containers: 
        - name: nginx
          image: nginx
  replicas: 3
  # tell 3 replicas; 3 active pods should run with this template always
  selector: #it is mandatory feild, while creating replicaset unlike in replication controller
  # this is the major difference in Relication Controller and replicaset
  # Replica set requires selector definition
  # selector section helps replicaset identify what pods fall under it,

  spec.template.metadata.labels #the labels under this template must match with the lables defined in the selector section, if it doesn't match, then apiserver rejects the replicaset definition file yaml
  
  # replicaset can also manage the pods that were not created by replicaset creation
  # this can be acheived by defining the match labels/match expressions under selector
  # whichever pods labels match these, if those pods are unmanaged then those pods can be managed by this replicaset
  # ex: certain pods created before the creation replicaset, that match labelssepecified in the selector,replicaset will also take those pods into consideration when creating replicas


  selector section:

  # the selector field is mandatory in a ReplicaSet, and it supports both exact matching (matchLabels) and advanced set-based filtering (matchExpressions).
  
# Two Ways to Define a ReplicaSet Selector

# • matchLabels (Equality-based): This works just like a ReplicationController selector by checking for exact key-value matches. Every label listed here must match the pod's labels for the ReplicaSet to manage it.

it is a key : value ;both the key and value must match
# if multiple keys are there then all those keys and values must match

syntax:
selector:
  MatchLabels: 
    key1: value1
    key2: value2

# • matchExpressions (Set-based): This lets you filter pods using operators like In, NotIn, Exists, and DoesNotExist. For example, you can manage pods where the tier label is either frontend or backend.

syntax:

selector:
  MatchExpressions: 
    - key: Key_name1
      operator: operator_name(IN, NotIN, Exists, DoesNotExist)
      values: 
        - value1
        - value2
        - value3
   
    - key: key_name2
      operator: operator_name(IN, NotIN, Exists, DoesNotExist)
      values: 
        - value1
        - value2
        - value3
-------------------------

if both Matchlabels and MatchExpressions defined, then both must match

a pod must satisfy both matchLabels and matchExpressions simultaneously to be managed by this ReplicaSet.
In Kubernetes, all conditions defined inside spec.selector are combined using a logical AND.
• Between matchLabels and matchExpressions: Combined with AND (both sections must pass).
• Multiple items inside matchLabels: Combined with AND (all listed labels must match).
• Multiple items inside matchExpressions: Combined with AND (all expression blocks must pass).
• Multiple values inside a single In expression: Combined with OR (the label value only needs to match one item from the list, such as prod OR staging).
-------------
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: redis-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis
    matchExpressions:
      - key: environment
        operator: In
        values:
          - prod
          - staging
  template:
    metadata:
      labels:
        app: redis
        environment: prod  # Must satisfy both matchLabels and matchExpressions
    spec:
      containers:
      - name: redis
        image: redis


Key Rules to Remember

• Template Alignment: The labels inside spec.template.metadata.labels must match the rules defined in spec.selector. 

If they do not match, the Kubernetes API server will reject the YAML file.

• Immutable Field: Once you create a ReplicaSet, you cannot change its spec.selector without deleting and recreating the resource.
• Adoption of Existing Pods: If unmanaged pods already exist in the namespace with labels matching the selector, the ReplicaSet will automatically adopt them as part of its replica count.




apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-rs
spec:
  replicas: 2
  selector:
    matchExpressions:
      - key: tier
        operator: In
        values:
          - frontend
          - backend
      - key: environment
        operator: NotIn
        values:
          - dev
          - test
      - key: team
        operator: Exists
      - key: deprecated
        operator: DoesNotExist
  template:
    metadata:
      labels:
        tier: frontend      # Satisfies 'In'
        environment: prod   # Satisfies 'NotIn' (neither dev nor test)
        team: payments      # Satisfies 'Exists' (value can be anything)
                            # 'deprecated' label is omitted, satisfying 'DoesNotExist'
    spec:
      containers:
      - name: nginx
        image: nginx


How Each Operator Works

• In: The pod must have the specified label key, and its value must match at least one item in the values list.
• NotIn: The pod matches 
# if its label value is not in the values list, 
# or if the label key is completely missing from the pod.

• Exists: The pod simply needs to have the label key present, regardless of its value (never include a values field with Exists).

• DoesNotExist: The pod must not have that label key at all (never include a values field with DoesNotExist).

