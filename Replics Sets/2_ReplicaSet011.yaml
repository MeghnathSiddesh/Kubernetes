# to create a replicaset

kubelet create -f replicaset01.yaml

# to view replicas
kubectl get replicaset

# to view the pods(replicas under replicaset)
kubectl get nodes

kubectl delete replicaset myapp-replicaset
# to delete replicaset and along with the pods it is managing

kubectl replace -f replicaset-definition-file.yaml
# used to update or replace the replicaset definition file

# updates an existing ReplicaSet in your cluster by completely overwriting its configuration with the contents of your YAML file.

What Happens When You Run It

Full Overwrite: Unlike kubectl apply (which merges changes), replace replaces the entire live object definition a/c your file. Any field omitted from your YAML file is reset to its default value.
# so if a pod image or container name is changed, then the change will carried upcoming pods, not on current pods

• Must Already Exist: The ReplicaSet named in metadata.name must already be running in the cluster. If it does not exist yet, Kubernetes throws a NotFound error.

• Pod Template Behavior: If you updated spec.replicas, Kubernetes scales pods up or down immediately. However, if you changed spec.template (such as a new container image), existing pods are not restarted automatically; only newly created pods will use the updated template.

# here kubectl replace -f replicaset-definition-file.yaml only updates the ReplicaSet's blueprint (spec.template), so existing running pods will keep running the old image until you delete them.
# and for upcoming pods/new pods only the change will be replicated
# for that you need to delete the exisiting pods
kubectl delete pod -l <key>=<value>
# (Replace <key>=<value> with your pod label, such as app=redis, or delete each pod individually with kubectl delete pod <pod-name>.)
# or delete individually
kubectl delete pod pod_name

# Check that the recreated pods are running the updated container image.
kubectl get pods -o wide



Common Errors & Quick Fixes

• Immutable Field Error: If you modified spec.selector or metadata.name, kubectl replace will fail because those fields cannot be edited in place. 

# Add --force (kubectl replace --force -f replicaset-definition-file.yaml) to delete and recreate the ReplicaSet cleanly.
# it will delete the existing replicaset and creates new one

• Missing File Path: Make sure replicaset-definition-file.yaml is in your current terminal directory, or provide the full path to the file.

