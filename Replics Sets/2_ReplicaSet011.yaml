scaling in replicaset

lets we initially configured the replicase count to 3
later we want to increase it to 6

how do we update replicas count to 6 to scale up to 6 pods

# 1)update the replicaset configuration(yaml) file with replicas to 6

kubectl create -f replicaset-definition.yaml

# -f -> file as input, it will take mentioned next to it as file

# this will update the replica set to have 6 replicas, without downtime
# if other changes are made in definition file like image name changes, then the changes will be reflected for upcoming pods

2)kubectl scale --replicas=6 -f replicaset-definition.yaml

# 3)you can also use replicaset name in type name format to increase replicas count

syntax: kubectl scale --replicas=6 type replicaset_name

ex: kubectl scale --replicas=6 replicaset my-app-replicaset

# but with method 2 and 3 the even though your replicas count increases, your replicaset configuration(yaml file) in this file, the replicas count still remain 3

# the changing relplicas count will not require downtime, as it only required changing in definition file

# similarly when you scale down the replicas count, the apiserver will immediately terminate certain pods to bring it to desired state

kubectl scale --replicas=2 replicaset my-app-replicaset


# changing the image name, ports, env variable and other container specifications requires downtime
# you can update the replicaset definition file with new spec ( image name, ports, env variable and other container specifications) and you can update the replicaset to use this updated definition file using kubectl create/replace command
# but the changes only applies to new upcoming pods, so you need to delete the existing pod and post that new pods created will have the new specification
4) we also have option to scale replicaset to scale based on traffic(without hardocding replicas count in yaml file)
